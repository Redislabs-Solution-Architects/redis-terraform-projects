#==============================================================================
# REDIS ENTERPRISE MONITORING UI + FAILOVER DEMO CONFIGURATION
# User-configurable values only. Deployment-time values are generated by deploy.sh.
#==============================================================================

deployment_region: region1
refresh_interval: 5

# Optional overrides. Leave empty or zero to auto-detect.
namespace: ""
database_name: ""
database_port: 0

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

failover:
  preferred_region: region1
  failures_detection_window_seconds: 2
  min_num_failures: 2
  failure_rate_threshold: 0.5
  health_check_interval_seconds: 5
  health_check_probes: 3
  health_check_probe_delay_seconds: 0.5
  auto_fallback_interval_seconds: 10
  failover_attempts: 3
  failover_delay_seconds: 1
  grace_period_seconds: 5
  command_retries: 1
  use_lag_aware_health_check: false
  lag_tolerance_ms: 100
  lag_aware_rest_api_port: 9443
  lag_aware_verify_tls: false

demo:
  auto_start: false
  key_prefix: redis-ca-demo
  workload_interval_seconds: 2
